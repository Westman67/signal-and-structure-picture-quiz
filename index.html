ant_url":"/quiz/variants/var_4de36c7c9049.jpg","original_url":"/quiz/originals/orig_4de36c7c9049.jpg","source_filename":"Gross Anatomy and Histology Picture Atlas.pdf#page=43&image=082","category":"Cardiomyopathy","modality":"Gross pathology","question_type":"single-best-answer","tested_concept":"Restrictive cardiomyopathy","stem":"Which diagnosis is most consistent with this gross specimen?","options":["Cardiac amyloidosis","Chagas cardiomyopathy","Restrictive cardiomyopathy","Hypertrophic cardiomyopathy"],"correct_index":2,"explanation":"This image demonstrates Restrictive cardiomyopathy. The decisive pattern is the visual finding described below.","visual_clues":"A nondilated stiff ventricle accompanies diffuse interstitial fibrosis on microscopy.","atlas_page":43,"lecture_page":null,"sequence":170},{"question_id":"q_90a8f48b8fc0","source_id":"src_9e7592c5ab04","variant_id":"var_90a8f48b8fc0","variant_url":"/quiz/variants/var_90a8f48b8fc0.jpg","original_url":"/quiz/originals/orig_90a8f48b8fc0.jpg","source_filename":"Gross Anatomy and Histology Picture Atlas.pdf#page=44&image=083","category":"Inflammatory","modality":"Gross pathology","question_type":"single-best-answer","tested_concept":"Acute fibrinous pericarditis","stem":"Which diagnosis is most consistent with this gross specimen?","options":["Aschoff body","Cardiac sarcoidosis","Acute fibrinous pericarditis","Acute rheumatic valvulitis"],"correct_index":2,"explanation":"This image demonstrates Acute fibrinous pericarditis. The decisive pattern is the visual finding described below.","visual_clues":"A shaggy fibrin coat covers the epicardial surface and forms a superficial eosinophilic exudate histologically.","atlas_page":44,"lecture_page":null,"sequence":171},{"question_id":"q_d75d636587c7","source_id":"src_d75d636587c7","variant_id":"var_d75d636587c7","variant_url":"/quiz/variants/var_d75d636587c7.jpg","original_url":"/quiz/originals/orig_d75d636587c7.jpg","source_filename":"Cardiovascular EKG Tracings - Lecture Images Only.pdf#page=02&image=001","category":"Rhythm","modality":"ECG","question_type":"single-best-answer","tested_concept":"Sinus bradycardia","stem":"Which rhythm is shown?","options":["Junctional rhythm","Idioventricular rhythm","Complete atrioventricular block","Sinus bradycardia"],"correct_index":3,"explanation":"Sinus bradycardia retains normal sinus activation but at a rate below 60 beats per minute.","visual_clues":"Uniform sinus P waves precede each narrow QRS complex, and the R-R intervals are widely spaced and regular.","atlas_page":null,"lecture_page":2,"sequence":172},{"question_id":"q_7d52619eddde","source_id":"src_7d52619eddde","variant_id":"var_7d52619eddde","variant_url":"/quiz/variants/var_7d52619eddde.jpg","original_url":"/quiz/originals/orig_7d52619eddde.jpg","source_filename":"Cardiovascular EKG Tracings - Lecture Images Only.pdf#page=03&image=002","category":"Rhythm","modality":"ECG","question_type":"single-best-answer","tested_concept":"Sinus tachycardia","stem":"Which rhythm is shown?","options":["Atrial flutter","Atrial fibrillation","Sinus tachycardia","Supraventricular tachycardia"],"correct_index":2,"explanation":"Sinus tachycardia is a regular narrow-complex rhythm with a sinus P wave before every QRS complex.","visual_clues":"The tracing is fast and regular, with a consistent upright P wave preceding each narrow QRS.","atlas_page":null,"lecture_page":3,"sequence":173},{"question_id":"q_0a1989bec846","source_id":"src_0a1989bec846","variant_id":"var_0a1989bec846","variant_url":"/quiz/variants/var_0a1989bec846.jpg","original_url":"/quiz/originals/orig_0a1989bec846.jpg","source_filename":"Cardiovascular EKG Tracings - Lecture Images Only.pdf#page=04&image=003","category":"Rhythm","modality":"ECG","question_type":"single-best-answer","tested_concept":"Supraventricular tachycardia","stem":"Which tachyarrhythmia best fits this strip?","options":["Monomorphic ventricular tachycardia","Supraventricular tachycardia","Sinus tachycardia","Atrial flutter with 2:1 conduction"],"correct_index":1,"explanation":"Paroxysmal supraventricular tachycardia typically appears as a very regular narrow-complex tachycardia in which atrial activity is hidden or retrograde.","visual_clues":"The QRS complexes are narrow and extremely regular, while distinct sinus P waves are not visible before each complex.","atlas_page":null,"lecture_page":4,"sequence":174},{"question_id":"q_968cce2b7f50","source_id":"src_968cce2b7f50","variant_id":"var_968cce2b7f50","variant_url":"/quiz/variants/var_968cce2b7f50.jpg","original_url":"/quiz/originals/orig_968cce2b7f50.jpg","source_filename":"Cardiovascular EKG Tracings - Lecture Images Only.pdf#page=06&image=005","category":"Rhythm","modality":"ECG","question_type":"single-best-answer","tested_concept":"Atrial fibrillation","stem":"Which atrial rhythm is shown?","options":["Atrial fibrillation","Atrial flutter","Multifocal atrial tachycardia","Sinus arrhythmia"],"correct_index":0,"explanation":"Atrial fibrillation produces disorganized atrial activity with variable AV conduction.","visual_clues":"The R-R intervals are irregularly irregular, and no consistent discrete P waves precede the QRS complexes.","atlas_page":null,"lecture_page":6,"sequence":175},{"question_id":"q_f65400329a0c","source_id":"src_f65400329a0c","variant_id":"var_f65400329a0c","variant_url":"/quiz/variants/var_f65400329a0c.jpg","original_url":"/quiz/originals/orig_f65400329a0c.jpg","source_filename":"Cardiovascular EKG Tracings - Lecture Images Only.pdf#page=08&image=007","category":"Rhythm","modality":"ECG","question_type":"single-best-answer","tested_concept":"Idioventricular rhythm","stem":"Which escape rhythm is shown?","options":["Sinus bradycardia","Atrial fibrillation with slow response","Idioventricular rhythm","Junctional escape rhythm"],"correct_index":2,"explanation":"An idioventricular rhythm originates in the ventricles and therefore produces a slow rhythm with broad abnormal QRS complexes.","visual_clues":"The ventricular rate is slow, the QRS complexes are wide, and organized preceding P waves are not evident.","atlas_page":null,"lecture_page":8,"sequence":176},{"question_id":"q_80488f15882b","source_id":"src_80488f15882b","variant_id":"var_80488f15882b","variant_url":"/quiz/variants/var_80488f15882b.jpg","original_url":"/quiz/originals/orig_80488f15882b.jpg","source_filename":"Cardiovascular EKG Tracings - Lecture Images Only.pdf#page=09&image=008","category":"Rhythm","modality":"ECG","question_type":"single-best-answer","tested_concept":"Onset of monomorphic ventricular tachycardia","stem":"Which rhythm begins after the initial sinus beats?","options":["Supraventricular tachycardia","Torsades de pointes","Ventricular fibrillation","Monomorphic ventricular tachycardia"],"correct_index":3,"explanation":"Monomorphic ventricular tachycardia is a rapid regular wide-complex rhythm with a stable QRS shape from beat to beat.","visual_clues":"After two narrow sinus beats, an abrupt run of uniform broad complexes begins and remains regular.","atlas_page":null,"lecture_page":9,"sequence":177},{"question_id":"q_c37ddb380dd8","source_id":"src_c37ddb380dd8","variant_id":"var_c37ddb380dd8","variant_url":"/quiz/variants/var_c37ddb380dd8.jpg","original_url":"/quiz/originals/orig_c37ddb380dd8.jpg","source_filename":"Cardiovascular EKG Tracings - Lecture Images Only.pdf#page=11&image=010","category":"Rhythm","modality":"ECG","question_type":"single-best-answer","tested_concept":"Premature supraventricular contraction","stem":"Which type of premature beat interrupts this rhythm?","options":["Sinus pause","Premature supraventricular contraction","Premature ventricular contraction","Ventricular escape beat"],"correct_index":1,"explanation":"A premature atrial or junctional beat reaches the ventricles through the normal conduction system, so the early QRS remains narrow.","visual_clues":"An early narrow complex interrupts the regular rhythm; its atrial deflection is premature and partly deforms the preceding T wave.","atlas_page":null,"lecture_page":11,"sequence":178},{"question_id":"q_50b94c908ba4","source_id":"src_50b94c908ba4","variant_id":"var_50b94c908ba4","variant_url":"/quiz/variants/var_50b94c908ba4.jpg","original_url":"/quiz/originals/orig_50b94c908ba4.jpg","source_filename":"Cardiovascular EKG Tracings - Lecture Images Only.pdf#page=13&image=012","category":"Rhythm","modality":"ECG","question_type":"single-best-answer","tested_concept":"Multifocal premature ventricular complexes","stem":"Which ectopic pattern is demonstrated?","options":["Premature atrial complexes","Atrial fibrillation","Multifocal premature ventricular complexes","Unifocal premature ventricular complexes"],"correct_index":2,"explanation":"PVCs arising from different ventricular foci have more than one premature wide-QRS morphology.","visual_clues":"Two premature broad complexes occur without normal preceding P waves and have visibly different shapes.","atlas_page":null,"lecture_page":13,"sequence":179},{"question_id":"q_5f4dd65d5879","source_id":"src_5f4dd65d5879","variant_id":"var_5f4dd65d5879","variant_url":"/quiz/variants/var_5f4dd65d5879.jpg","original_url":"/quiz/originals/orig_5f4dd65d5879.jpg","source_filename":"Cardiovascular EKG Tracings - Lecture Images Only.pdf#page=19&image=018","category":"Conduction","modality":"ECG","question_type":"single-best-answer","tested_concept":"QRS prolongation","stem":"Which waveform measurement is abnormal in this strip?","options":["QRS duration is prolonged","PR interval is prolonged","QT interval is shortened","ST segment is depressed"],"correct_index":0,"explanation":"A wide QRS reflects delayed ventricular depolarization, whether from bundle-branch disease, ventricular pacing, pre-excitation, or ventricular origin.","visual_clues":"Each ventricular complex spans more small boxes than a normal narrow QRS while the rhythm remains regular.","atlas_page":null,"lecture_page":19,"sequence":180},{"question_id":"q_485fee0c7341","source_id":"src_485fee0c7341","variant_id":"var_485fee0c7341","variant_url":"/quiz/variants/var_485fee0c7341.jpg","original_url":"/quiz/originals/orig_485fee0c7341.jpg","source_filename":"Cardiovascular EKG Tracings - Lecture Images Only.pdf#page=21&image=020","category":"Cardiomyopathy","modality":"ECG","question_type":"single-best-answer","tested_concept":"Left ventricular hypertrophy with strain","stem":"Which structural ECG pattern is demonstrated?","options":["Acute anterior STEMI","Left ventricular hypertrophy with strain","Right bundle branch block","Left bundle branch block"],"correct_index":1,"explanation":"Left ventricular hypertrophy can produce very high QRS voltage with secondary ST depression and asymmetric T-wave inversion in lateral leads.","visual_clues":"Deep right-precordial S waves and tall lateral R waves are accompanied by lateral repolarization abnormalities.","atlas_page":null,"lecture_page":21,"sequence":181},{"question_id":"q_4c2d99e0b792","source_id":"src_4c2d99e0b792","variant_id":"var_4c2d99e0b792","variant_url":"/quiz/variants/var_4c2d99e0b792.jpg","original_url":"/quiz/originals/orig_4c2d99e0b792.jpg","source_filename":"Cardiovascular EKG Tracings - Lecture Images Only.pdf#page=23&image=022","category":"Ischemia","modality":"ECG","question_type":"single-best-answer","tested_concept":"Inferior subendocardial ischemia","stem":"Which regional ischemic pattern best fits this ECG?","options":["Inferior STEMI","Anterior STEMI","Acute pericarditis","Inferior subendocardial ischemia"],"correct_index":3,"explanation":"Subendocardial ischemia can produce ST depression and T-wave abnormalities without diagnostic ST elevation.","visual_clues":"The inferior leads show ischemic ST-T changes without a contiguous inferior ST-elevation pattern.","atlas_page":null,"lecture_page":23,"sequence":182},{"question_id":"q_cd1b91dfe163","source_id":"src_cd1b91dfe163","variant_id":"var_cd1b91dfe163","variant_url":"/quiz/variants/var_cd1b91dfe163.jpg","original_url":"/quiz/originals/orig_cd1b91dfe163.jpg","source_filename":"Cardiovascular EKG Tracings - Lecture Images Only.pdf#page=24&image=023","category":"Conduction","modality":"ECG","question_type":"single-best-answer","tested_concept":"Second-degree AV block with 3:1 conduction","stem":"What atrioventricular conduction ratio is demonstrated?","options":["3:1 conduction","2:1 conduction","1:1 conduction","Complete AV dissociation"],"correct_index":0,"explanation":"With 3:1 second-degree AV block, only one of every three atrial depolarizations conducts to the ventricles.","visual_clues":"Regular P waves march through the strip, but only every third P wave is followed by a QRS complex.","atlas_page":null,"lecture_page":24,"sequence":183},{"question_id":"q_ae9bf0d0f2c5","source_id":"src_ae9bf0d0f2c5","variant_id":"var_ae9bf0d0f2c5","variant_url":"/quiz/variants/var_ae9bf0d0f2c5.jpg","original_url":"/quiz/originals/orig_ae9bf0d0f2c5.jpg","source_filename":"Cardiovascular EKG Tracings - Lecture Images Only.pdf#page=25&image=024","category":"Conduction","modality":"ECG","question_type":"single-best-answer","tested_concept":"Right bundle branch block morphology","stem":"Which intraventricular conduction pattern is present?","options":["Right bundle branch block","Left bundle branch block","Wolff-Parkinson-White pattern","Left ventricular hypertrophy"],"correct_index":0,"explanation":"Right bundle branch block delays right ventricular activation, producing a terminal rightward QRS force.","visual_clues":"The right precordial leads show a terminal R prime pattern, while lateral leads have broad terminal S waves.","atlas_page":null,"lecture_page":25,"sequence":184},{"question_id":"q_189864046d6e","source_id":"src_189864046d6e","variant_id":"var_189864046d6e","variant_url":"/quiz/variants/var_189864046d6e.jpg","original_url":"/quiz/originals/orig_189864046d6e.jpg","source_filename":"Cardiovascular EKG Tracings - Lecture Images Only.pdf#page=27&image=026","category":"Ischemia"," function results(){const score=state.session.reduce((n,q)=>n+(state.answers[q.question_id]===q.correct_index),0),pct=state.session.length?Math.round(score/state.session.length*100):0; const cats=[...new Set(state.session.map(q=>q.category))].map(c=>{const a=state.session.filter(q=>q.category===c),n=a.filter(q=>state.answers[q.question_id]===q.correct_index).length;return {c,n,t:a.length}}); const missed=state.session.filter(q=>state.answers[q.question_id]!==q.correct_index); return shell(`<main class="results-page"><section class="results-hero"><div class="page-kicker">Session complete</div><h1>${pct}%</h1><p>${score} of ${state.session.length} correct</p><div class="results-actions"><button class="button primary" data-action="retrymissed" ${!missed.length?'disabled':''}>Retry missed</button><button class="button secondary" data-action="newsession">New session</button></div></section><div class="results-grid"><section class="panel"><h2>Performance by category</h2>${cats.map(x=>`<div class="result-row"><span>${esc(x.c)}</span><div><span class="mini-track"><i style="width:${x.n/x.t*100}%"></i></span><strong>${x.n}/${x.t}</strong></div></div>`).join('')}</section><section class="panel"><h2>${missed.length?'Review missed':'Perfect session'}</h2>${missed.length?`<div class="missed-list">${missed.map(q=>`<div><span>${esc(q.category)}</span><strong>${esc(q.stem)}</strong><b>${esc(q.options[q.correct_index])}</b><p>${esc(q.explanation)}</p></div>`).join('')}</div>`:'<div class="perfect"><span>✓</span><strong>No missed questions</strong><p>Nice work.</p></div>'}</section></div></main>`)}
function library(){return shell(`<main class="library-page"><div class="page-kicker">Source governance</div><div class="library-heading"><div><h1>Library & review queue</h1><p>Only manually approved, answer-safe derivatives enter play.</p></div><button class="button secondary" data-action="home">Back to setup</button></div><div class="stat-row"><div class="stat"><strong>${MANIFEST.summary.total_records}</strong><span>governed source records</span></div><div class="stat"><strong>${MANIFEST.summary.usable}</strong><span>active questions</span></div><div class="stat"><strong>${MANIFEST.summary.needs_review}</strong><span>awaiting review</span></div><div class="stat"><strong>${MANIFEST.summary.broken}</strong><span>broken images</span></div></div><section class="library-grid"><article class="panel"><h2>Release boundary</h2><p>All ${MANIFEST.summary.usable} active sources were visually checked and converted to neutral-ID variants. Titles, captions, and answer labels were cropped or masked where needed.</p><div class="policy"><span class="status-dot usable"></span>USABLE enters randomization</div><div class="policy"><span class="status-dot hold"></span>Reference, duplicate, and broken records stay out</div></article><article class="panel"><h2>Shareable edition</h2><p>This edition runs entirely in the browser. No server, account, database, or internet connection is required after the file loads.</p></article></section><section class="panel queue-panel"><h2>Review status</h2>${REVIEW.items.length?`<p>${REVIEW.items.length} records remain awaiting review.</p>`:'<div class="resolved-banner"><span>✓</span><div><strong>No unresolved sources</strong><p>Every inventoried image has a release decision.</p></div></div>'}</section></main>`)}
function render(){const app=document.getElementById('app');app.innerHTML=state.screen==='quiz'?quiz():state.screen==='results'?results():state.screen==='library'?library():home();window.scrollTo(0,0)}
function start(pool=eligible(),requested=state.length){if(!pool.length)return;state.session=shuffled(pool).slice(0,requested===0?pool.length:requested);state.answers={};state.index=0;state.zoom=1;state.showOriginal=false;state.screen='quiz';render()}
function choose(i){const q=state.session[state.index];if(!q||state.answers[q.question_id]!==undefined)return;state.answers[q.question_id]=i;const p=prog(q.question_id),ok=i===q.correct_index;state.progress[q.question_id]={...p,attempts:p.attempts+1,correct:p.correct+(ok?1:0),seen:true,missed:!ok};saveProgress();render()}
function next(){const q=state.session[state.index];if(!q||state.answers[q.question_id]===undefined)return;if(state.index===state.session.length-1){state.screen='results'}else{state.index++;state.zoom=1;state.showOriginal=false}render()}
function download(obj,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.mode){state.mode=t.dataset.mode;render();return}if(t.dataset.category!==undefined){const c=t.dataset.category;state.selectedCategories=state.selectedCategories.includes(c)?state.selectedCategories.filter(x=>x!==c):[...state.selectedCategories,c];render();return}if(t.dataset.length!==undefined){state.length=Number(t.dataset.length);render();return}if(t.dataset.filter){state.filter=t.dataset.filter;render();return}if(t.dataset.choice!==undefined){choose(Number(t.dataset.choice));return}const a=t.dataset.action;if(!a)return;if(a==='home'||a==='newsession'||a==='end'){state.screen='home';render()}else if(a==='library'){state.screen='library';render()}else if(a==='toggle-all'){state.selectedCategories=state.selectedCategories.length===categories.length?[]:[...categories];render()}else if(a==='start')start();else if(a==='next')next();else if(a==='back'&&state.index>0){state.index--;state.zoom=1;state.showOriginal=false;render()}else if(a==='mark'){const q=state.session[state.index],p=prog(q.question_id);state.progress[q.question_id]={...p,marked:!p.marked};saveProgress();render()}else if(a==='zoomin'){state.zoom=Math.min(2.25,state.zoom+.25);render()}else if(a==='zoomout'){state.zoom=Math.max(1,state.zoom-.25);render()}else if(a==='original'){state.showOriginal=!state.showOriginal;render()}else if(a==='retrymissed'){start(state.session.filter(q=>state.answers[q.question_id]!==q.correct_index),0)}else if(a==='export'){download(state.progress,'signal-structure-progress.json')}else if(a==='import'){document.getElementById('progress-import').click()}})
document.getElementById('progress-import').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||typeof x!=='object'||Array.isArray(x))throw Error();state.progress=x;saveProgress();render()}catch(err){alert('That file is not a valid Signal & Structure progress export.')}};r.readAsText(f);e.target.value=''})
window.addEventListener('keydown',e=>{if(state.screen!=='quiz')return;const q=state.session[state.index],locked=q&&state.answers[q.question_id]!==undefined;if(['1','2','3','4'].includes(e.key))choose(Number(e.key)-1);else if((e.key==='Enter'||e.key==='ArrowRight')&&locked)next();else if(e.key==='ArrowLeft'&&state.index>0){state.index--;state.zoom=1;state.showOriginal=false;render()}else if(e.key.toLowerCase()==='m'){const p=prog(q.question_id);state.progress[q.question_id]={...p,marked:!p.marked};saveProgress();render()}else if(e.key==='+'||e.key==='='){state.zoom=Math.min(2.25,state.zoom+.25);render()}else if(e.key==='-'){state.zoom=Math.max(1,state.zoom-.25);render()}})
render();
</script></body></html>
